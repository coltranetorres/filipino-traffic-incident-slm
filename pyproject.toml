[project]
name = "trafficslm"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Cole", email = "coltranetorres@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mlx-lm>=0.32.2",
